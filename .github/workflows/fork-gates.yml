name: Fork gates

# Full-suite gates on GitHub-hosted runners; upstream CI pins Blacksmith runners this fork lacks.
on:
  push:
    branches: ["ci/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    name: ruff check (blocking rules)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: pipx run ruff check .

  test:
    name: Run tests (${{ matrix.slice }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: ./.github/actions/setup-pm
        with:
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web"]'
          test-environment: 'true'
          prune-python-cache: true
      - run: scripts/run_tests.sh
        env:
          HERMES_TEST_SLICE: ${{ matrix.slice }}/4
          HERMES_TEST_WORKERS: 4
          HERMES_TEST_FILE_TIMEOUT: 600
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

  baseline:
    name: Baseline failures on base (${{ matrix.slice }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: bf0203a794a07aac3ff764972ab9087baa4e4f4e
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: ./.github/actions/setup-pm
        with:
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web"]'
          test-environment: 'true'
          prune-python-cache: true
      - run: scripts/run_tests.sh
        env:
          HERMES_TEST_SLICE: ${{ matrix.slice }}/4
          HERMES_TEST_WORKERS: 4
          HERMES_TEST_FILE_TIMEOUT: 600
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
